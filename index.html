<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учет посещаемости</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 10px; background: #f4f4f9; color: #333; }
        h1, h2 { text-align: center; color: #4a4a4a; }
        button { cursor: pointer; padding: 12px 18px; margin: 5px; border: none; border-radius: 4px; background: #3498db; color: white; font-size: 15px; }
        button:hover { background: #2980b9; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        .hidden { display: none !important; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .list-item { display: block; width: 100%; text-align: left; background: #fff; color: #333; border: 1px solid #ccc; font-size: 16px; margin-bottom: 8px; font-weight: bold; }
        .list-item:hover { background: #eaeaea; }
        .back-btn { background: #7f8c8d; }
        .back-btn:hover { background: #616a6b; }
        .save-btn { background: #2ecc71; }
        .save-btn:hover { background: #27ae60; }
        .delete-btn { background: #e74c3c; padding: 6px 10px; font-size: 12px; }
        .delete-btn:hover { background: #c0392b; }
        .view-btn { background: #9b59b6; display: block; width: 100%; margin: 20px 0; font-size: 16px; }
        .view-btn:hover { background: #8e44ad; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background: #34495e; color: white; }
        tr:nth-child(even) { background: #f9f9f9; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .radio-group { margin: 15px 0; font-size: 16px; }
        .radio-group label { margin-right: 20px; cursor: pointer; }
        .loader { text-align: center; color: #e67e22; font-weight: bold; margin: 10px 0; }
        .cat-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media(min-width: 480px) { .cat-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

    <!-- Главная страница -->
    <div id="screen-main" class="card">
        <h1 id="main-title">Список духовенства</h1>
        <div id="people-list"></div>
        <button class="view-btn" onclick="showScreen('table')">📊 Посмотреть общую таблицу данных</button>
    </div>

    <!-- Выбор категории -->
    <div id="screen-category" class="card hidden">
        <h2 id="current-person-title"></h2>
        <div class="cat-grid">
            <button onclick="selectCategory('Обед')">🍽️ Отметить обед</button>
            <button onclick="selectCategory('Молебен')">⛪ Отметить молебен</button>
            <button onclick="selectCategory('Служба')">🛡️ Отметить службу</button>
            <button onclick="selectCategory('Требы')">📜 Ввести требы за неделю</button>
            <button onclick="selectCategory('Мероприятие')">🎉 Участие в мероприятии</button>
        </div>
        <br>
        <button class="back-btn" style="width: 100%;" onclick="showScreen('main')">⬅️ Назад к списку</button>
    </div>

    <!-- Отметка Обеда / Молебна / Службы -->
    <div id="screen-attendance" class="card hidden">
        <h2 id="attendance-title"></h2>
        <div class="radio-group">
            <label><input type="radio" name="status" value="Был" checked onclick="toggleReason(false)"> Был</label>
            <label><input type="radio" name="status" value="Не был" onclick="toggleReason(true)"> Не был</label>
        </div>
        <div id="reason-block" class="hidden">
            <label>Укажите причину отсутствия:</label>
            <input type="text" id="absence-reason" placeholder="Например: болен, командировка">
        </div>
        <div id="auth-loader-1" class="loader hidden">Сохранение в облако... подождите</div>
        <button id="save-btn-1" class="save-btn" onclick="saveAttendance()">💾 Сохранить</button>
        <button class="back-btn" onclick="showScreen('category')">Отмена</button>
    </div>

    <!-- Ввод Треб -->
    <div id="screen-treby" class="card hidden">
        <h2 id="treby-title"></h2>
        <label>Количество треб за неделю:</label>
        <input type="number" id="treby-count" min="0" placeholder="Введите число, например: 5">
        <label>Дополнительный комментарий (необязательно):</label>
        <input type="text" id="treby-comment" placeholder="Особенности или примечания">
        <div id="auth-loader-3" class="loader hidden">Сохранение в облако... подождите</div>
        <button id="save-btn-3" class="save-btn" onclick="saveTreby()">💾 Сохранить</button>
        <button class="back-btn" onclick="showScreen('category')">Отмена</button>
    </div>

    <!-- Отметка Мероприятия -->
    <div id="screen-event" class="card hidden">
        <h2 id="event-title"></h2>
        <label>Название мероприятия:</label>
        <input type="text" id="event-name" placeholder="Например: Субботник">
        <label>Что там делал:</label>
        <input type="text" id="event-role" placeholder="Например: сослужил, помогал">
        <div id="auth-loader-2" class="loader hidden">Сохранение в облако... подождите</div>
        <button id="save-btn-2" class="save-btn" onclick="saveEvent()">💾 Сохранить</button>
        <button class="back-btn" onclick="showScreen('category')">Отмена</button>
    </div>

    <!-- Экран таблицы -->
    <div id="screen-table" class="card hidden">
        <h2>Сводная таблица записей</h2>
        <button class="back-btn" onclick="showScreen('main')">⬅️ Назад на главную</button>
        <div id="table-loader" class="loader hidden">Загрузка актуальных данных из Google Sheets...</div>
        <div style="overflow-x: auto; margin-top: 15px;">
            <table>
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Имя</th>
                        <th>Тип</th>
                        <th>Статус / Кол-во</th>
                        <th>Причина / Роль</th>
                        <th class="admin-only">Действие</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // !!! ВСТАВЬТЕ ССЫЛКУ НА ВАШ GOOGLE APPS SCRIPT МЕЖДУ КАВЫЧКАМИ !!!
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx2c1yoKl7NGR4g65eoJ64C8qaaieK-GdTAwowWUVtF0JvfUkszYEjE8PMyXlXfBk63/exec";

        // Проверяем, админ зашел или обычный пользователь
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === 'true';

        const people = [
            "Игумен ПАВЕЛ (Полуков)",
            "Архимандрит СИЛУАН (Пасенко)",
            "Иеромонах ИОАСАФ (Швецов)",
            "Иеромонах ИРИНЕЙ (Пиковский)",
            "Иеромонах АНАСТАСИЙ (Байков)",
            "Иеромонах НИКОДИМ (Северин)",
            "Иеромонах РАФАИЛ (Попов)",
            "Иеромонах ДАМИАН (Шевцов)",
            "Иеромонах КЛИМЕНТ (Бучнев)",
            "Иерей ВАДИМ Подзигун",
            "Диакон СЕРГИЙ Кульпинов",
            "Иеродиакон КОСМА (Сковорода)",
            "Монах НИКИТА (Гашев)",
            "Инок ИОАНН (Толкачевас)"
        ];

        let currentPerson = "";
        let currentCategory = "";

        function init() {
            // Если зашел обычный пользователь, сразу перенаправляем его на таблицу просмотра
            if (!isAdmin) {
                document.querySelectorAll('.back-btn').forEach(el => el.classList.add('hidden'));
                document.getElementById('main-title').innerText = "Архив посещаемости (Просмотр)";
                showScreen('table');
            } else {
                showScreen('main');
            }

            const listContainer = document.getElementById("people-list");
            listContainer.innerHTML = "";
            people.forEach(person => {
                const btn = document.createElement("button");
                btn.className = "list-item";
                btn.innerText = person;
                btn.onclick = () => {
                    currentPerson = person;
                    document.getElementById("current-person-title").innerText = person;
                    showScreen('category');
                };
                listContainer.appendChild(btn);
            });
        }

        function showScreen(screenName) {
            document.getElementById("screen-main").classList.add("hidden");
            document.getElementById("screen-category").classList.add("hidden");
            document.getElementById("screen-attendance").classList.add("hidden");
            document.getElementById("screen-treby").classList.add("hidden");
            document.getElementById("screen-event").classList.add("hidden");
            document.getElementById("screen-table").classList.add("hidden");

            if(screenName === 'main' && isAdmin) document.getElementById("screen-main").classList.remove("hidden");
            if(screenName === 'category' && isAdmin) document.getElementById("screen-category").classList.remove("hidden");
            if(screenName === 'attendance' && isAdmin) document.getElementById("screen-attendance").classList.remove("hidden");
            if(screenName === 'treby' && isAdmin) document.getElementById("screen-treby").classList.remove("hidden");
            if(screenName === 'event' && isAdmin) document.getElementById("screen-event").classList.remove("hidden");
            if(screenName === 'table') {
                document.getElementById("screen-table").classList.remove("hidden");
                loadTableFromGoogle();
            }
        }

        function selectCategory(category) {
            currentCategory = category;
            if (category === 'Обед' || category === 'Молебен' || category === 'Служба') {
                document.getElementById("attendance-title").innerText = `${currentPerson} — ${category}`;
                document.querySelector('input[name="status"][value="Был"]').checked = true;
                toggleReason(false);
                document.getElementById("absence-reason").value = "";
                showScreen('attendance');
            } else if (category === 'Требы') {
                document.getElementById("treby-title").innerText = `${currentPerson} — Требы`;
                document.getElementById("treby-count").value = "";
                document.getElementById("treby-comment").value = "";
                showScreen('treby');
            } else if (category === 'Мероприятие') {
                document.getElementById("event-title").innerText = `${currentPerson} — Мероприятие`;
                document.getElementById("event-name").value = "";
                document.getElementById("event-role").value = "";
                showScreen('event');
            }
        }

        function toggleReason(show) {
            const block = document.getElementById("reason-block");
            if (show) block.classList.remove("hidden");
            else block.classList.add("hidden");
        }

        function sendToGoogle(payload, loaderId, btnId) {
            document.getElementById(loaderId).classList.remove("hidden");
            document.getElementById(btnId).disabled = true;

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("Данные успешно записаны!");
                document.getElementById(loaderId).classList.add("hidden");
                document.getElementById(btnId).disabled = false;
                showScreen('main');
            })
            .catch(err => {
                alert("Ошибка сохранения: " + err);
                document.getElementById(loaderId).classList.add("hidden");
                document.getElementById(btnId).disabled = false;
            });
        }

        function saveAttendance() {
            const status = document.querySelector('input[name="status"]:checked').value;
            const reason = status === "Не был" ? document.getElementById("absence-reason").value : "-";
            const timestamp = new Date().toLocaleString("ru-RU");
            sendToGoogle({ 
                timestamp, 
                name: currentPerson, 
                type: currentCategory, 
                val1: status, 
                val2: reason 
            }, "auth-loader-1", "save-btn-1");
        }

        function saveTreby() {
            const count = document.getElementById("treby-count").value;
            const comment = document.getElementById("treby-comment").value.trim();
            if(!count) { 
                alert("Укажите число треб!"); 
                return; 
            }
            const timestamp = new Date().toLocaleString("ru-RU");
            sendToGoogle({ 
                timestamp, 
                name: currentPerson, 
                type: currentCategory, 
                val1: count, 
                val2: comment || "-" 
            }, "auth-loader-3", "save-btn-3");
        }

        function saveEvent() {
            const name = document.getElementById("event-name").value.trim();
            const role = document.getElementById("event-role").value.trim();
            if(!name) { 
                alert("Введите название мероприятия!"); 
                return; 
            }
            const timestamp = new Date().toLocaleString("ru-RU");
            sendToGoogle({ 
                timestamp, 
                name: currentPerson, 
                type: currentCategory, 
                val1: name, 
                val2: role || "-" 
            }, "auth-loader-2", "save-btn-2");
        }

        function loadTableFromGoogle() {
            const tbody = document.getElementById("table-body");
            const loader = document.getElementById("table-loader");
            tbody.innerHTML = "";
            loader.classList.remove("hidden");
            
            // Скрываем заголовок столбца действий, если не админ
            if (!isAdmin) {
                document.querySelectorAll('.admin-only').forEach(el => el.classList.add('hidden'));
            }
            
            fetch(WEB_APP_URL)
                .then(res => res.json())
                .then(data => {
                    loader.classList.add("hidden");
                    if(!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Данных пока нет</td></tr>';
                        return;
                    }
                    data.reverse().forEach(item => {
                        const tr = document.createElement("tr");
                        const deleteButton = isAdmin ? `<button class="delete-btn" onclick="deleteRow('${item.rowId}')">❌ Удалить</button>` : '';
                        tr.innerHTML = `
                            <td>${item.timestamp}</td>
                            <td><b>${item.name}</b></td>
                            <td>${item.type}</td>
                            <td>${item.val1}</td>
                            <td>${item.val2}</td>
                            <td class="${isAdmin ? '' : 'hidden'}">${deleteButton}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    loader.classList.add("hidden");
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Ошибка загрузки: ${err}</td></tr>`;
                });
        }

        function deleteRow(rowId) {
            if(!isAdmin) return;
            if(confirm("Вы точно хотите удалить эту запись из Google Таблицы?")) {
                const loader = document.getElementById("table-loader");
                loader.classList.remove("hidden");
                fetch(WEB_APP_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ action: "delete", rowId: rowId })
                })
                .then(() => {
                    alert("Запрос на удаление отправлен! Таблица обновится через пару секунд.");
                    setTimeout(() => { loadTableFromGoogle(); }, 2000);
                })
                .catch(err => {
                    alert("Ошибка при удалении: " + err);
                    loadTableFromGoogle();
                });
            }
        }

        init();
    </script>
</body>
</html>
